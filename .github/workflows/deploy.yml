name: Deploy a Ferozo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy por vez: si hay uno corriendo, el nuevo espera
concurrency:
  group: deploy-ferozo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Primero assets e íconos; index.html y sw.js al final,
      # así nadie recibe un index que apunta a archivos que todavía no subieron.
      - name: Subir dist por FTPS
        timeout-minutes: 10
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set cmd:fail-exit yes;
            open --env-password -u c2871848 c2871848.ferozo.com;
            mirror -R --verbose --parallel=3 --exclude-glob index.html --exclude-glob sw.js dist/ public_html/;
            put -O public_html/ dist/sw.js;
            put -O public_html/ dist/index.html
          "
